<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>レポートのデザイン確認</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.7 Meiryo,sans-serif;background:#f4f7fb;color:#20334c}header{padding:18px 24px;background:#173e7c;color:white}h1{margin:0;font-size:22px}header p{margin:5px 0;font-size:13px}.layout{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 105px)}aside{overflow:auto;padding:24px;background:white;border-right:1px solid #dfe7f1}label{display:block;margin-bottom:15px;font-size:13px}input:not([type=checkbox]),textarea{display:block;width:100%;padding:9px;border:1px solid #bccbdd;border-radius:6px;font:inherit}input[type=checkbox]{margin-right:8px}button,a.button{display:inline-block;border:0;border-radius:7px;background:#2467db;color:#fff;padding:10px 14px;font:inherit;text-decoration:none;cursor:pointer;margin:5px 0}iframe{width:100%;height:100%;border:0}details{border-top:1px solid #dfe7f1;padding-top:12px;margin-top:15px}summary{cursor:pointer;font-weight:bold}#status{font-size:13px}small{color:#62748b}.actions{position:sticky;top:-24px;background:white;padding:8px 0;border-bottom:1px solid #dfe7f1;margin-bottom:20px}@media(max-width:800px){.layout{display:block;height:auto}aside{max-height:55vh}iframe{height:80vh}header{padding:14px}}</style>
<header><h1>レポートのデザイン確認</h1><p>文字サイズ・色・表示項目を変更して、右側で確認できます。見本の数字は実績ではありません。</p></header>
<div class="layout"><aside><div class="actions"><a class="button" href="https://app.pagescms.org/" target="_blank" rel="noopener">編集・公開画面を開く</a><br><small>この画面の変更はプレビューのみです。公開する設定は編集画面で保存してください。</small><div id="status" role="status"></div></div><form id="fields"></form><button id="reset" type="button">公開中の設定に戻す</button></aside><iframe id="preview" title="レポートのプレビュー" src="index.html?preview=1"></iframe></div>
<script>
let current,original;const preview=document.getElementById('preview');
const send=()=>preview.contentWindow.postMessage({type:'report-design',design:current},location.origin);
function draw(schema){const form=document.getElementById('fields');form.replaceChildren();for(const field of schema){const label=document.createElement('label');label.textContent=field.label;const input=document.createElement(field.type==='text'?'textarea':'input');input.name=field.name;if(field.type==='boolean'){input.type='checkbox';input.checked=current[field.name];}else{input.type=field.type==='number'?'number':field.name.endsWith('Color')||field.name.endsWith('Background')?'color':'text';input.value=current[field.name];if(field.type==='number'){input.min=0;input.max=100;input.step=.25;}}input.addEventListener('input',()=>{current[field.name]=field.type==='boolean'?input.checked:field.type==='number'?Number(input.value):input.value;send();document.getElementById('status').textContent='プレビューを変更しました（未公開）';});label.append(input);form.append(label);}}
Promise.all(['design.json','design-fields.json'].map(p=>fetch(p,{cache:'no-cache'}).then(r=>r.json()))).then(([d,s])=>{current=d;original=structuredClone(d);draw(s);preview.onload=send;send();document.getElementById('reset').onclick=()=>{current=structuredClone(original);draw(s);send();document.getElementById('status').textContent='公開中の設定に戻しました';};}).catch(()=>document.getElementById('status').textContent='設定を読み込めませんでした。再読み込みしてください。');
</script></html>
