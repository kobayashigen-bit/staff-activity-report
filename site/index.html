<header><h1 id="title">スタッフ別活動レポート</h1></header>
<main><section class="filters" aria-label="表示条件">

<label>対象月<select id="month"></select></label></section>
<div id="status" class="status" role="status" aria-live="polite">日報を読み込んでいます…</div><div id="notice" class="notice" hidden></div><div id="empty" hidden>掲載対象のスタッフはいません。</div>
<div id="memberCount" class="memberCount"></div><div id="content"></div><template id="staffTemplate"><details class="staffReport"><summary class="identity"><div><p data-field="affiliation"></p><h2 data-field="name"></h2></div></summary>

</details></template>

<script src="design.js"></script><script>
let data=null;let design={}, connection={};
let loading=false;
const areaKey=new URLSearchParams(location.search).get('area')||'iwate';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>n==null||!Number.isFinite(Number(n))?'—':Number(n).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const signed=(n,d=0)=>n==null||!Number.isFinite(Number(n))?'—':(n>0?'＋':n<0?'−':'±')+fmt(Math.abs(n),d);
const labels={reporting:'活動報告不足',activity:'活動時間不足',approach:'アプローチ改善',talk:'アプローチ後のトークの見直し',none:'今回の確認対象には該当しません',pending:'判定保留'};
const channelNames=['ブロック','テナント','社内','施行後','既存','その他'];
function options(id,values,all){const prev=$(id).value;$(id).innerHTML=(all?'<option value="">'+all+'</option>':'')+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(values.includes(prev))$(id).value=prev;}
function card(title,value,unit,reference,label,diff,digits=0){
 const ratio=value!=null&&reference>0?value/reference:null;
 return '<article class="card"><h3>'+title+'</h3><div class="metric">'+fmt(value,digits)+'<span class="unit">'+unit+'</span>'+'</div><div class="bar" aria-hidden="true"><span style="width:'+(ratio==null?0:Math.max(0,Math.min(100,ratio*100)))+'%"></span></div><div class="meta"><span class="standard">'+label+' '+fmt(reference,label==='10口達成者水準'?0:digits)+unit+'</span><span class="delta">'+diff+'</span></div></article>';
}
const staffOpenState=new Map();
function selectFunnelAttention(s){
 const metrics=Object.fromEntries(Object.entries(s.metrics).map(([k,v])=>[k,{...v}]));
 const p=metrics.presentations,c=metrics.closings;
 if(p&&c&&(p.attention||c.attention)&&s.days>0&&p.value!=null&&c.value!=null&&p.goal>0&&c.goal>0){
  const pRate=p.value/(p.goal/20*s.days),cRate=c.value/(c.goal/20*s.days);
  p.attention=pRate<=cRate+1e-10;c.attention=!p.attention;
 }
 return {...s,metrics};
}
function render(){
 const members=data.staff.filter(s=>!s.excludeFromReport);
 $('content').replaceChildren();$('empty').hidden=members.length>0;
 $('memberCount').textContent=members.length?'掲載スタッフ '+members.length+'名':'';
 members.forEach(s=>{const root=$('staffTemplate').content.firstElementChild.cloneNode(true);$('content').appendChild(root);renderStaff(selectFunnelAttention(s),root);const identity=JSON.stringify([s.branch,s.name]);root.open=staffOpenState.get(identity)===true;root.addEventListener('toggle',()=>staffOpenState.set(identity,root.open));});
}
function staffSituations(s,report){
 const m=s.metrics||{},num=v=>typeof v==='number'&&Number.isFinite(v),value=k=>m[k]?.value;
 const ratio=k=>num(value(k))&&s.days>0&&m[k].goal>0?value(k)/(m[k].goal/20*s.days):null;
 const visits=ratio('visits'),approaches=ratio('approaches'),p=value('presentations'),c=value('closings'),a=value('approaches'),combined=value('combined');
 const conditions=[
  [visits!==null&&visits<=.7+1e-10&&num(s.units)&&s.units<10,'訪問件数が不足している'],
  [visits!==null&&approaches!==null&&visits>=.7-1e-10&&approaches<=.7+1e-10,'アプローチの前にお断りされていることが多い'],
  [num(p)&&num(a)&&a>0&&p/a<.1-1e-10,'プレゼンまで進めないことが多い'],
  [num(p)&&num(c)&&p>0&&c/p<=.5+1e-10,'クロージングをしていない/できないトークの流れになっている'],
  [num(s.contracts)&&num(c)&&c>0&&s.contracts/c<=.1+1e-10,'クロージングのタイミング、文言、言い方に修正余地がある']
 ];
 const first=conditions.find(([matches])=>matches),result=first?[first[1]]:[];
 if(num(combined)&&num(c)&&combined>c)result.push('見込み違いが発生している可能性がある');
 return result;
}
function renderStaff(s,root){
 const $=field=>root.querySelector('[data-field="'+field+'"]');
 $('affiliation').textContent='';$('affiliation').hidden=true;
 $('name').textContent=(s.branch.endsWith('支店')?s.branch:s.branch+'支店')+'/'+s.name;

 const names={reporting:'活動報告',dailyHours:'募集活動時間（移動、会議時間を除く）',visits:'訪問件数',approaches:'アプローチ数',presentations:'プレゼン数',closings:'クロージング数',combined:'見込み・アポ数'};
 const situations=staffSituations(s,data);
 const mentioned=new Set();
 const related=[
  ['訪問件数が不足している',['visits']],
  ['アプローチの前にお断りされていることが多い',['approaches']],
  ['プレゼンまで進めないことが多い',['presentations']],
  ['クロージングをしていない/できないトークの流れになっている',['closings']],
  ['クロージングのタイミング、文言、言い方に修正余地がある',['closings','contracts']],
  ['見込み違いが発生している可能性がある',['combined']]
 ];
 related.forEach(([text,keys])=>{if(situations.includes(text))keys.forEach(k=>mentioned.add(k));});
 const badgeFor=key=>{
  const m=s.metrics[key],goal=m&&(key==='dailyHours'?m.goal:m.goal/20*s.days);
  return mentioned.has(key)&&m&&m.value!=null&&goal>0&&m.value/goal<=.7+1e-10;
 };
 const top=['dailyHours','visits','approaches','presentations','closings'].find(badgeFor)||null;
 const elapsed=data.reportUntil?.slice(0,7)===data.month?Number(data.reportUntil.slice(8)):0;
 const contractAlert=typeof s.contracts==='number'&&Number.isFinite(s.contracts)&&(elapsed>=28?s.contracts<11:elapsed>=21?s.contracts<8:elapsed>=14?s.contracts<5:elapsed>=7?s.contracts<=2:false);
 $('assessment').innerHTML='<span class="phenomenonHeading">起きている可能性がある現象</span><ul class="situationList">'+situations.map(text=>'<li class="assessmentGap">'+esc(text)+'</li>').join('')+'</ul>';
 $('assessment').hidden=situations.length===0;

 const breakdown=(key,time=false)=>{
  const groups=[['ブロック',[0]],['自社イベント',[2]],['店頭イベント',[1]],['施行後訪問',[3]],['その他',[4,5]]];
  return '<details class="channelDetails"><summary>詳細</summary><div class="channelRows">'+groups.map(([label,indices])=>{
   const values=indices.map(i=>s.channels?.[i]?.[key]);
   const value=values.every(v=>typeof v==='number'&&Number.isFinite(v))?values.reduce((a,b)=>a+b,0):null;
   return '<div><span>'+label+'</span><b>'+fmt(value==null?null:time?value/60:value,time?1:0)+(time?'時間':key==='units'?'口':'件')+'</b></div>';
  }).join('')+'</div></details>';
 };
 const valueHtml=(value,unit,digits=0)=>'<div class="metric">'+fmt(value,digits)+'<span class="unit">'+unit+'</span></div>';
 const box=(key,title,body)=>'<article data-metric="'+key+'" class="card'+(top===key?' attention':'')+(key==='contracts'&&contractAlert?' contractAttention':'')+'">'+(badgeFor(key)?'<span class="attentionLabel">要確認</span>':'')+'<h3>'+title+'</h3>'+body+'</article>';
 let html=box('reporting','報告日数（月累計）',valueHtml(s.reportedDays,'日')+'<p class="reportReminder">出勤日数分の日報が入力されているかご確認ください</p>');
 const daily=s.metrics.dailyHours;
 html+=box('dailyHours','募集活動時間',valueHtml(s.minutes==null?null:s.minutes/60,'時間',1)+'<div class="compactMeta">1活動日あたり：'+fmt(daily.value,1)+'時間</div>'+breakdown('minutes',true));
 ['visits','approaches','presentations','closings'].forEach(key=>{
  const m=s.metrics[key],standard=m.goal/20*s.days,progress=m.value==null||!s.days?null:m.value/standard*100;
  let body=key==='visits'?'<div class="subMetricLabel">訪問件数</div>':'';
  body+=valueHtml(m.value,'件');
  const barValue=progress==null?0:Math.max(0,Math.min(100,progress));
  body+='<div class="visualProgress'+(progress!=null&&progress>=100?' achieved':'')+'"><div class="progressHeading"><span>進捗率</span><b>'+fmt(progress)+'％</b></div><div class="progressTrack" role="img" aria-label="進捗率 '+fmt(progress)+'パーセント"><span style="width:'+barValue+'%"></span></div><div class="progressTarget">目安：'+fmt(standard)+'件</div></div>';
  if(key==='visits')body+='<div class="subMetricLabel">声掛け数</div>'+valueHtml(s.calls,'件');
  if(key!=='visits')body+=breakdown(key);
  html+=box(key,key==='visits'?'訪問件数・声掛け数':names[key],body);
 });
 html+=box('contracts','契約件数',valueHtml(s.contracts,'件')+breakdown('contracts'));
 html+=box('units','口数',valueHtml(s.units,'口')+breakdown('units'));
 const rateText=rate=>fmt(rate==null?null:rate*100)+'％';
 const stages=[['アプローチ',s.metrics.approaches.value],['プレゼン',s.metrics.presentations.value],['クロージング',s.metrics.closings.value],['契約',s.contracts]];
 const closeCount=s.metrics.closings.value;
 const rates=[s.presentationRate,s.closingRate,closeCount>0&&s.contracts!=null?s.contracts/closeCount:null];
 const flow='<div class="transitionFlow" data-field="transitionFlow" aria-label="営業活動の実績と移行率"><div class="transitionHeading">各指標への移行率</div>'+stages.map(([label,value],i)=>'<span class="flowStage">'+label+'<b class="flowActual">（'+fmt(value)+'件）</b></span>'+(i<3?'<span class="flowLink"><b>'+rateText(rates[i])+'</b><span aria-hidden="true">⟶</span><small>移行率</small></span>':'')).join('')+'</div>';

 $('cards').innerHTML=html;
 $('cards').querySelector('[data-metric="presentations"]').insertAdjacentHTML('beforebegin',flow);

}

function loaded(r){loading=false;data=r;$('title').textContent=(r.areaLabel?r.areaLabel+'｜':'')+'スタッフ別活動レポート';document.title=$('title').textContent;options('month',r.months.includes(r.month)?r.months:[r.month,...r.months]);$('month').value=r.month;
 $('status').textContent='';
 const warnings=[];if(r.mappingPendingCount)warnings.push('氏名の照合待ち '+r.mappingPendingCount+'名。誤った不足判定を避けるため掲載を保留しています。');if(r.updateFailed)warnings.push('自動更新を再試行中です。前回正常に更新できたデータを表示しています。');if(r.preview)warnings.push('画面確認用です。データ更新はGAS版で元シートに接続します。');if(r.invalidCount)warnings.push('数値の確認待ち '+r.invalidCount+'名表記。異なる重複回答・入力不備がある人の数値判定は保留しています。');if(r.issues.length)warnings.push('日付などの不備で集計できない回答 '+r.issues.length+'件。');
 $('notice').hidden=!warnings.length;$('notice').className='notice';$('notice').textContent=warnings.join(' ');render();applyDesign();}
function failure(e){loading=false;$('status').textContent='更新に失敗しました。';$('notice').hidden=false;$('notice').className='notice error';$('notice').textContent=e.message||String(e);}

async function refresh(){
 if(loading)return;loading=true;$('status').textContent='実績を読み込んでいます…';
 try{
  const url=new URL(connection.endpoint);url.searchParams.set('format','pages');url.searchParams.set('area',areaKey);
  if($('month').value)url.searchParams.set('month',$('month').value);
  const response=await fetch(url.href,{cache:'no-store',signal:AbortSignal.timeout(90000)});
  if(!response.ok)throw Error('実績を取得できませんでした。');
  const result=await response.json();if(!Array.isArray(result.staff))throw Error('実績データの形式を確認してください。');
  loaded(result);applyDesign();
 }catch(e){failure(new Error('実績を読み込めませんでした。時間をおいて再読み込みしてください。'));console.error(e);}
}
async function boot(){
 try{
  [design,connection]=await Promise.all(['design.json','connection.json'].map(async path=>{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw Error('設定読込エラー');return r.json();}));
  applyDesign();
  if(new URLSearchParams(location.search).get('preview')==='1'){
    const r=await fetch('sample.json');loaded(await r.json());applyDesign();return;
  }
  await refresh();
 }catch(e){failure(e);}
}
$('month').onchange=refresh;
setInterval(()=>{if(!document.hidden&&!new URLSearchParams(location.search).has('preview'))refresh();},60000);
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='report-design')return;
 design=event.data.design; if(data)render();applyDesign();
});
boot();
</script></body></html>
