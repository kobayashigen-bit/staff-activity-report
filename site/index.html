d:#eef8f4;border-color:#badfce;border-left-color:#35846a}.assessment strong{display:block;font-size:16px}.assessment p{margin:4px 0 0;font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:21px 23px}.card h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 9px}.metric{font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--blue);line-height:1.3}.unit{font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:7px}.bar{height:6px;background:#e9eef5;border-radius:8px;margin:18px 0 10px;overflow:hidden}.bar span{display:block;background:var(--blue);height:100%;border-radius:8px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.delta{color:#385779}.section{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px}.section h2{font-size:17px;margin:0 0 16px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.flow>div{background:#f3f7fd;border-radius:8px;padding:14px}.flow b{font-size:24px;color:var(--navy)}.flow p{margin:3px 0;font-size:12px;color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{text-align:right;background:#f6f8fc;color:var(--muted);font-weight:500}td{text-align:right}th,td{padding:11px 12px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}.spark{display:flex;align-items:end;gap:3px;height:130px;margin:15px 0 0;border-bottom:1px solid var(--line)}.spark>div{flex:1;min-width:0;display:flex;align-items:center;flex-direction:column;justify-content:end;height:100%}.spark i{display:block;background:#91b4ec;width:80%;min-height:0;border-radius:3px 3px 0 0}.spark span{font-size:9px;color:var(--muted);height:18px}.legend{font-size:12px;color:var(--muted)}details{margin-top:20px}summary{cursor:pointer;font-size:13px;color:var </style></head><body>
<header><h1 id="title">スタッフ別活動レポート</h1></header>
<main><section class="filters" aria-label="表示条件">

<label>対象月<select id="month"></select></label></section>
<div id="status" class="status" role="status" aria-live="polite">日報を読み込んでいます…</div><div id="notice" class="notice" hidden></div><div id="empty" hidden>掲載対象のスタッフはいません。</div>
<div id="memberCount" class="memberCount"></div><div id="content"></div><template id="staffTemplate"><article class="staffReport"><section class="identity"><div><p data-field="affiliation"></p><h2 data-field="name"></h2></div></section>
<section data-field="assessment" class="assessment" aria-label="確認事項"></section><div data-field="cards" class="cards"></div>



</article></template>
</main>
<script src="design.js"></script><script>
let data=null;let design={}, connection={};
let loading=false;
const areaKey=new URLSearchParams(location.search).get('area')||'iwate';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>n==null||!Number.isFinite(Number(n))?'—':Number(n).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const signed=(n,d=0)=>n==null||!Number.isFinite(Number(n))?'—':(n>0?'＋':n<0?'−':'±')+fmt(Math.abs(n),d);
const labels={reporting:'活動報告不足',activity:'活動時間不足',approach:'アプローチ改善',talk:'アプローチ後のトークの見直し',none:'今回の確認対象には該当しません',pending:'判定保留'};
const channelNames=['ブロック','テナント','社内','施行後','既存','その他'];
function options(id,values,all){const prev=$(id).value;$(id).innerHTML=(all?'<option value="">'+all+'</option>':'')+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(values.includes(prev))$(id).value=prev;}
function card(title,value,unit,reference,label,diff,digits=0){
 const ratio=value!=null&&reference>0?value/reference:null;
 return '<article class="card"><h3>'+title+'</h3><div class="metric">'+fmt(value,digits)+'<span class="unit">'+unit+'</span>'+'</div><div class="bar" aria-hidden="true"><span style="width:'+(ratio==null?0:Math.max(0,Math.min(100,ratio*100)))+'%"></span></div><div class="meta"><span class="standard">'+label+' '+fmt(reference,label==='10口達成者水準'?0:digits)+unit+'</span><span class="delta">'+diff+'</span></div></article>';
}
function render(){
 const members=data.staff.filter(s=>!s.excludeFromReport&&!!s.primaryIssue);
 $('content').replaceChildren();$('empty').hidden=members.length>0;
 $('memberCount').textContent=members.length?'確認対象スタッフ '+members.length+'名':'';
 members.forEach(s=>{const root=$('staffTemplate').content.firstElementChild.cloneNode(true);$('content').appendChild(root);renderStaff(s,root);});
}
function renderStaff(s,root){
 const $=field=>root.querySelector('[data-field="'+field+'"]');
 $('affiliation').textContent='';$('affiliation').hidden=true;
 $('name').textContent=(s.branch.endsWith('支店')?s.branch:s.branch+'支店')+'/'+s.name;

 const names={reporting:'活動報告',dailyHours:'活動時間',visits:'訪問件数',approaches:'アプローチ数',presentations:'プレゼン数',closings:'クロージング数',combined:'見込み・アポ数'};
 const top=['dailyHours','visits','approaches','presentations','closings'].find(key=>s.metrics[key]&&s.metrics[key].attention)||null;
 const topMetric=top?s.metrics[top]:null;
 const issueNames={dailyHours:'活動時間',visits:'訪問件数',approaches:'アプローチ',presentations:'プレゼン',closings:'クロージング',combined:'見込み・アポ数'};
 const issueKeys=Object.keys(issueNames).filter(key=>s.metrics[key]&&s.metrics[key].attention);
 $('assessment').innerHTML='<span class="assessmentBadge">要確認</span><div class="assessmentValue">'+issueKeys.map((key,index)=>'<p class="assessmentGap"><strong'+(index?' class="secondaryIssue"':'')+'>'+esc(issueNames[key])+'</strong></p>').join('')+'</div>';
 const reportPeriod=data.reportUntil.slice(0,7)===data.month?Number(data.month.slice(5))+'月1日～'+Number(data.month.slice(5))+'月'+Number(data.reportUntil.slice(8))+'日':Number(data.month.slice(5))+'月1日～（集計開始前）';
 let html='<article class="card"><h3>報告日数（月累計）</h3><div class="metric">'+fmt(s.reportedDays)+'<span class="unit">日</span></div><p class="reportReminder">出勤日数分の日報が入力されているかご確認ください</p></article>';
 ['dailyHours','visits','approaches','presentations','closings','combined'].forEach(key=>{
   const m=s.metrics[key],daily=key==='dailyHours',unit=daily?'時間':'件';
   const primary=top===key;
   const flag=primary?'要確認':m.attention?'要確認':'';
   const showProgress=['visits','approaches','presentations','closings'].includes(key);
   const cumulativeStandard=daily?m.goal:m.goal/20*s.days,progress=m.value==null||!s.days?null:m.value/cumulativeStandard*100;
   const progressHtml=showProgress?'<span class="progress"><span class="progressCaption">（進捗率：</span><span class="progressNumber">'+fmt(progress,0)+'</span><span class="progressCaption">％）</span></span>':'';
   const diff=m.value==null?null:daily?(m.value-m.goal)*60:m.value-m.goal;
   html+='<article class="card'+(primary?' attention':'')+'">'+(flag?'<span class="attentionLabel">'+flag+'</span>':'')+'<h3>'+(daily?'1日あたりの活動時間':names[key])+'</h3><div class="metric">'+fmt(m.value,daily?1:0)+'<span class="unit">'+unit+'</span>'+progressHtml+'</div><div class="bar" aria-hidden="true"><span style="width:'+Math.max(0,Math.min(100,showProgress?(progress||0):(cumulativeStandard>0?(m.value||0)/cumulativeStandard*100:0)))+'%"></span></div><div class="meta"><span class="standard">'+'10口達成者水準'+' '+fmt(cumulativeStandard,0)+unit+'</span>'+'</div>';

   if(key==='presentations'||key==='closings'){
     const rate=key==='presentations'?s.presentationRate:s.closingRate;
     html+='<div class="conversion"><div><span class="conversionLabel">'+(key==='presentations'?'プレゼン率（アプローチ→プレゼンへの移行率）':'クロージング率（プレゼン→クロージングへの移行率）')+'</span><strong>'+fmt(rate==null?null:rate*100,0)+'<span class="conversionUnit">%</span></strong></div></div>';
   }
   html+='</article>';
 });
 html+=card('当月累計 契約口数',s.units,'口',Number(data.cutoff.slice(8))<=7?4:Number(data.cutoff.slice(8))<=14?6:Number(data.cutoff.slice(8))<=21?8:10,'達成ライン','');
 html+=card('当月累計活動時間',s.minutes==null?null:s.minutes/60,'時間',s.days*5,'10口達成者水準','活動 '+s.days+'日',1);
 $('cards').innerHTML=html;

}

function loaded(r){loading=false;data=r;$('title').textContent=(r.areaLabel?r.areaLabel+'｜':'')+'スタッフ別活動レポート';document.title=$('title').textContent;options('month',r.months.includes(r.month)?r.months:[r.month,...r.months]);$('month').value=r.month;
 $('status').textContent='';
 const warnings=[];if(r.mappingPendingCount)warnings.push('氏名の照合待ち '+r.mappingPendingCount+'名。誤った不足判定を避けるため掲載を保留しています。');if(r.updateFailed)warnings.push('自動更新を再試行中です。前回正常に更新できたデータを表示しています。');if(r.preview)warnings.push('画面確認用です。データ更新はGAS版で元シートに接続します。');if(r.invalidCount)warnings.push('数値の確認待ち '+r.invalidCount+'名表記。異なる重複回答・入力不備がある人の数値判定は保留しています。');if(r.issues.length)warnings.push('日付などの不備で集計できない回答 '+r.issues.length+'件。');
 $('notice').hidden=!warnings.length;$('notice').className='notice';$('notice').textContent=warnings.join(' ');render();applyDesign();}
function failure(e){loading=false;$('status').textContent='更新に失敗しました。';$('notice').hidden=false;$('notice').className='notice error';$('notice').textContent=e.message||String(e);}

async function refresh(){
 if(loading)return;loading=true;$('status').textContent='実績を読み込んでいます…';
 try{
  const url=new URL(connection.endpoint);url.searchParams.set('format','pages');url.searchParams.set('area',areaKey);
  if($('month').value)url.searchParams.set('month',$('month').value);
  const response=await fetch(url.href,{cache:'no-store',signal:AbortSignal.timeout(90000)});
  if(!response.ok)throw Error('実績を取得できませんでした。');
  const result=await response.json();if(!Array.isArray(result.staff))throw Error('実績データの形式を確認してください。');
  loaded(result);applyDesign();
 }catch(e){failure(new Error('実績を読み込めませんでした。時間をおいて再読み込みしてください。'));console.error(e);}
}
async function boot(){
 try{
  [design,connection]=await Promise.all(['design.json','connection.json'].map(async path=>{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw Error('設定読込エラー');return r.json();}));
  applyDesign();
  if(new URLSearchParams(location.search).get('preview')==='1'){
    const r=await fetch('sample.json');loaded(await r.json());applyDesign();return;
  }
  await refresh();
 }catch(e){failure(e);}
}
$('month').onchange=refresh;
setInterval(()=>{if(!document.hidden&&!new URLSearchParams(location.search).has('preview'))refresh();},60000);
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='report-design')return;
 design=event.data.design; if(data)render();applyDesign();
});
boot();
</script></body></html>
